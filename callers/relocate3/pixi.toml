[workspace]
name = "relocate3-benchmark-env"
description = "Frozen RelocaTE3 runtime for the benchmark (pinned git rev)"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.10"
minimap2 = ">=2.24"
bwa = ">=0.7.17"
bwa-mem2 = ">=2.2"
bowtie2 = ">=2.5"
samtools = ">=1.17"
bcftools = ">=1.17"
bedtools = ">=2.30"
pysam = ">=0.20"
biopython = ">=1.81"
pybedtools = "*"
# blat is optional (bioconda build conflicts with the plotting stack); provide it
# on PATH to enable the relocate3-blat-* variants.

[pypi-dependencies]
# Frozen RelocaTE3: pinned to stajichlab/main at the BLAT RelocaTE2-parity fix
# (2026-08-05, commit 50f939e, PR #40 -- BLAT now runs with RelocaTE2's
# -minScore=10 -tileSize=7 instead of BLAT's insensitive defaults 30/11, which
# was the blat-bwaaln recall gap; also adds per-stage aligner option passthrough
# and the CLI --te-opts/--genome-opts flags for parameter sweeps).
# Supersedes d4b5597 (bwaaln genome backend), whose content it contains.
# HTTPS URL so pixi can clone without SSH.
RelocaTE3 = { git = "https://github.com/stajichlab/RelocaTE3.git", rev = "50f939e8d8c5599628bbb7b33533917bf283ec2c" }
