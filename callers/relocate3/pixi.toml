[workspace]
name = "relocate3-benchmark-env"
description = "Frozen RelocaTE3 runtime for the benchmark (pinned git rev)"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.10"
minimap2 = ">=2.24"
bwa = ">=0.7.17"
bwa-mem2 = ">=2.2"
bowtie2 = ">=2.5"
samtools = ">=1.17"
bcftools = ">=1.17"
bedtools = ">=2.30"
pysam = ">=0.20"
biopython = ">=1.81"
pybedtools = "*"
# blat is optional (bioconda build conflicts with the plotting stack); provide it
# on PATH to enable the relocate3-blat-* variants.

[pypi-dependencies]
# Frozen RelocaTE3: pinned to stajichlab/main at the BLAT-defaults revert
# (2026-08-11, commit 6fe6d5d, PR #41). This REPLACES the PR #40 pin 50f939e,
# which hardcoded RelocaTE2's -minScore=10 -tileSize=7 and proved to be a
# regression on riceTElib: precision collapsed with depth (0.635/0.406/0.231 at
# 5x/15x/30x vs RelocaTE2's steady ~0.83) and runtime rose ~8x. At BLAT defaults
# RelocaTE3 beats RelocaTE2 on recall, precision and F1 at every coverage.
# Retains PR #40's per-stage aligner option passthrough and the CLI
# --te-opts/--genome-opts flags. Supersedes d4b5597, whose content it contains.
#
# NOTE: this pin is only the FALLBACK. callers/relocate3/env.sh prefers the
# RT3_REPO dev checkout's own pixi env (editable install of the working tree)
# whenever RT3_REPO is set, which config/benchmark.toml does set. Keeping this
# pin correct matters because it is what runs if RT3_REPO is ever unset or
# missing -- a stale pin here would silently reintroduce the regression.
# HTTPS URL so pixi can clone without SSH.
RelocaTE3 = { git = "https://github.com/stajichlab/RelocaTE3.git", rev = "6fe6d5d" }
