[workspace]
name = "relocate3-benchmark-env"
description = "Frozen RelocaTE3 runtime for the benchmark (pinned git rev)"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.10"
minimap2 = ">=2.24"
bwa = ">=0.7.17"
bwa-mem2 = ">=2.2"
bowtie2 = ">=2.5"
samtools = ">=1.17"
bcftools = ">=1.17"
bedtools = ">=2.30"
pysam = ">=0.20"
biopython = ">=1.81"
pybedtools = "*"
# blat is optional (bioconda build conflicts with the plotting stack); provide it
# on PATH to enable the relocate3-blat-* variants.

[pypi-dependencies]
# TEMPORARY: editable local install so the benchmark uses the multi-aligner
# branch (feat-multi-aligner) before it is pushed/merged. Re-pin to a git rev
# (RelocaTE3 = { git = "...", rev = "<sha>" }) once the branch lands on main.
RelocaTE3 = { path = "/rhome/nmath020/bigdata/github/github_tools/RelocaTE/RelocaTE3_jason/RelocaTE3", editable = true }
