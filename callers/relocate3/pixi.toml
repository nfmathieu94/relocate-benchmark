[workspace]
name = "relocate3-benchmark-env"
description = "Frozen RelocaTE3 runtime for the benchmark (pinned git rev)"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.10"
minimap2 = ">=2.24"
bwa = ">=0.7.17"
bwa-mem2 = ">=2.2"
bowtie2 = ">=2.5"
samtools = ">=1.17"
bcftools = ">=1.17"
bedtools = ">=2.30"
pysam = ">=0.20"
biopython = ">=1.81"
pybedtools = "*"
# blat is optional (bioconda build conflicts with the plotting stack); provide it
# on PATH to enable the relocate3-blat-* variants.

[pypi-dependencies]
# Frozen RelocaTE3: pinned to stajichlab/main at the BLAT backend fixes
# (2026-07-24, commit f310a4d -- BlatBackend now converts the FASTQ query to FASTA
# and fills SAM SEQ from the query, so the blat TE-aligner actually produces
# flanking reads; includes the bwa mate-suffix, align-genome mate-anchor, and
# cross-device-move fixes). HTTPS URL so pixi can clone without an SSH key.
RelocaTE3 = { git = "https://github.com/stajichlab/RelocaTE3.git", rev = "f310a4d85393439bfef522cd5b15306c8ecb794c" }
