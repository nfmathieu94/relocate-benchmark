[workspace]
name = "relocate3-benchmark-env"
description = "Frozen RelocaTE3 runtime for the benchmark (pinned git rev)"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.10"
minimap2 = ">=2.24"
bwa = ">=0.7.17"
bwa-mem2 = ">=2.2"
bowtie2 = ">=2.5"
samtools = ">=1.17"
bcftools = ">=1.17"
bedtools = ">=2.30"
pysam = ">=0.20"
biopython = ">=1.81"
pybedtools = "*"
# blat is optional (bioconda build conflicts with the plotting stack); provide it
# on PATH to enable the relocate3-blat-* variants.

[pypi-dependencies]
# Frozen RelocaTE3: pinned to stajichlab/main at the align-genome mate-anchor fix
# (2026-07-24, commit b2f55a9 -- the align-genome CLI subcommand now mate-anchors
# ambiguous junction flanks with -1/-2, so the benchmark's granular-CLI path gets
# the paired-flank TSD fix). HTTPS URL so pixi can clone without an SSH key on the
# cluster.
RelocaTE3 = { git = "https://github.com/stajichlab/RelocaTE3.git", rev = "b2f55a93fbb16cffece9ee23a1489476ffa4eea4" }
