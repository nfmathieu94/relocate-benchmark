[workspace]
name = "relocate3-benchmark-env"
description = "Frozen RelocaTE3 runtime for the benchmark (pinned git rev)"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.10"
minimap2 = ">=2.24"
bwa = ">=0.7.17"
bwa-mem2 = ">=2.2"
bowtie2 = ">=2.5"
samtools = ">=1.17"
bcftools = ">=1.17"
bedtools = ">=2.30"
pysam = ">=0.20"
biopython = ">=1.81"
pybedtools = "*"
# blat is optional (bioconda build conflicts with the plotting stack); provide it
# on PATH to enable the relocate3-blat-* variants.

[pypi-dependencies]
# Frozen RelocaTE3: pinned to stajichlab/main at the bwaaln genome backend
# (2026-07-27, commit d4b5597 -- bwa aln/samse/sampe genome stage for the
# relocate3-blat-bwaaln R2-parity variant; includes support-dominant pairing,
# --require-both-junctions, BLAT backend, bwa mate-suffix, align-genome
# mate-anchor, cross-device-move fixes). HTTPS URL so pixi can clone without SSH.
RelocaTE3 = { git = "https://github.com/stajichlab/RelocaTE3.git", rev = "d4b55974dc4fba22c70e56bc53babb6669e51105" }
