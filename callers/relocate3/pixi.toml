[workspace]
name = "relocate3-benchmark-env"
description = "Frozen RelocaTE3 runtime for the benchmark (pinned git rev)"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.10"
minimap2 = ">=2.24"
bwa = ">=0.7.17"
bwa-mem2 = ">=2.2"
bowtie2 = ">=2.5"
samtools = ">=1.17"
bcftools = ">=1.17"
bedtools = ">=2.30"
pysam = ">=0.20"
biopython = ">=1.81"
pybedtools = "*"
# blat is optional (bioconda build conflicts with the plotting stack); provide it
# on PATH to enable the relocate3-blat-* variants.

[pypi-dependencies]
# Frozen RelocaTE3: pinned to stajichlab/main at the bwa TE mate-suffix fix
# (2026-07-24, commit 35ca17d -- BwaBackend.map_te_library restores the /1,/2
# suffix bwa strips, so the bwa TE-aligner mate-anchors flanks instead of
# scattering them single-end; includes the earlier align-genome mate-anchor and
# cross-device-move fixes). HTTPS URL so pixi can clone without an SSH key.
RelocaTE3 = { git = "https://github.com/stajichlab/RelocaTE3.git", rev = "35ca17d4742bb2f494b55c916036a854827ee818" }
