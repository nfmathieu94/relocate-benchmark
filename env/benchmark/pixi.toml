[workspace]
name = "relocate-benchmark-env"
description = "Frozen python + R stack for benchmark scoring and reporting"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
r-base = ">=4.3"
r-ggplot2 = "*"
r-dplyr = "*"
r-tidyr = "*"
r-patchwork = "*"
r-scales = "*"
r-forcats = "*"
pandas = ">=2.2,<4"
plotly = ">=6,<7"
streamlit = ">=1.45,<2"

[tasks]
# Run from the repository root so dashboard defaults and relative report paths
# behave the same whether this task is launched directly or through the wrapper.
dashboard = "cd ../.. && streamlit run dashboard/app.py --"
